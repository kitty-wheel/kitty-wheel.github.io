<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>我们做点什么</title>
<style>
  :root{
    --ink:#2b2b2b;      /* 线条色 */
    --ink2:#2b2b2b;     /* 文字色 */
    --bg:#ffffff;
    --red:#e60012;      /* 蝴蝶结红（正红） */
    --yellow:#f5c518;   /* 鼻子黄 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{min-height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    background:var(--bg);color:var(--ink2);
    display:flex;flex-direction:column;align-items:center;
    padding:calc(24px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));
  }
  .page{display:none;width:100%;flex-direction:column;align-items:center;flex:1;}
  .page.on{display:flex;}
  header{text-align:center;}
  h1{font-size:22px;font-weight:600;letter-spacing:3px;color:var(--ink2);}
  .sub{font-size:11px;letter-spacing:3px;color:var(--red);margin-top:8px;}
  .cdown{margin-top:10px;font-size:14px;font-weight:500;letter-spacing:1px;color:var(--red);
    font-variant-numeric:tabular-nums;}
  .cdown:empty{display:none;}
  .cdown{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;}
  .cdown .t{display:inline-block;}
  .cdown.rush .t{color:var(--ink2);}
  .rush-tip{height:18px;margin-top:6px;font-size:12px;letter-spacing:2px;color:#8a8a8a;
    opacity:0;transition:opacity .25s;}
  .rush-tip.on{opacity:1;}
  /* 地名字体：汉仪时光体，只截取了要用到的几个字，换地名要重新截取 place.woff2 */
  @font-face{font-family:"PlaceFont";src:url("place.woff2") format("woff2");font-display:swap;}
  .cd-place{color:var(--ink2);font-family:"PlaceFont",-apple-system,"PingFang SC",sans-serif;font-size:19px;}

  .stage{position:relative;width:min(86vw,340px);margin-top:26px;}
  .stage svg{display:block;width:100%;height:auto;overflow:visible;}
  .rotor{transition:transform 4.8s cubic-bezier(.15,.72,.12,1);transform-origin:200px 200px;}

  #spin{
    position:absolute;left:50%;top:calc(50% + 6px);transform:translate(-50%,-50%);
    width:27%;aspect-ratio:1.25;border-radius:50%;
    border:3px solid var(--ink);background:var(--yellow);
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--ink2);
    cursor:pointer;z-index:3;
  }
    #spin:active{transform:translate(-50%,-50%) scale(.92);}
  #spin:disabled{opacity:.45;}

  #pin{transform-box:view-box;transform-origin:200px 24px;transition:transform .07s ease-out;}

  .result{position:relative;margin-top:30px;font-size:19px;font-weight:600;letter-spacing:2px;min-height:46px;display:flex;align-items:center;justify-content:center;}
  .result span{border:2.5px solid var(--ink);background:var(--red);color:#fff;border-radius:999px;padding:8px 24px;animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

  /* 爪印爆开 */
  .burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;}
  .burst svg{position:absolute;width:22px;height:22px;left:-11px;top:-11px;
    animation:paw .85s cubic-bezier(.18,.9,.3,1) forwards;}
  @keyframes paw{
    0%{transform:translate(0,0) scale(.2) rotate(0);opacity:0}
    25%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rz));opacity:0}
  }

  .again{display:none;margin-top:14px;border:2.5px solid var(--ink);background:#fff;color:var(--ink2);
    border-radius:999px;padding:9px 22px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:1px;}
  .again.on{display:block;}
  .again:active{transform:scale(.95);}

  .panel{width:min(92vw,380px);margin-top:auto;padding-top:26px;}
  .toggle{width:100%;background:none;border:1.5px dashed var(--ink);border-radius:999px;
    color:var(--ink2);font-family:inherit;font-size:13px;letter-spacing:2px;padding:10px;}
  .list{display:none;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .list.on{display:flex;}
  .chip{border:1.5px solid #d4d4d4;border-radius:999px;padding:6px 8px 6px 13px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .chip button{border:none;background:none;color:#a8a8a8;font-size:15px;line-height:1;}
  .add{display:none;gap:10px;margin-top:12px;}
  .add input{flex:1;border:1.5px solid #d4d4d4;border-radius:999px;background:none;padding:9px 16px;
    font-size:15px;font-family:inherit;outline:none;color:var(--ink2);}
  .add input::placeholder{color:#bdbdbd;}
  .add button{border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink2);
    font-family:inherit;font-size:14px;font-weight:600;padding:0 20px;}

  /* ===== 底部标签栏 ===== */
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);
    border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:9;}
  .tabs button{flex:1;background:none;border:none;font-family:inherit;padding:11px 0 13px;
    font-size:12px;letter-spacing:2px;color:#b0b0b0;position:relative;}
  .tabs button.on{color:var(--ink2);font-weight:700;}
  .tabs button.on::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:18px;height:2.5px;border-radius:2px;background:var(--red);}
  .tabs .dot{position:absolute;top:8px;margin-left:3px;width:7px;height:7px;border-radius:50%;background:var(--red);}

  /* ===== 对战 ===== */
  .score{display:flex;align-items:center;gap:10px;}
  .sbox{flex:1;border:2.5px solid var(--ink);border-radius:16px;padding:14px 10px 12px;text-align:center;}
  .sbox .nm{display:block;font-size:12px;letter-spacing:2px;color:#8a8a8a;
    border-bottom:1px dashed #d8d8d8;padding-bottom:5px;margin-bottom:8px;}
  .sbox b{display:block;font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .sops{display:flex;gap:8px;margin-top:11px;}
  .sops button{flex:1;border:2px solid var(--ink);background:none;border-radius:999px;
    font-family:inherit;font-size:17px;font-weight:700;color:var(--ink2);padding:5px 0;}
  .sops button:last-child{background:var(--yellow);}
  .sops button:active{transform:scale(.93);}
  .vs{font-size:11px;letter-spacing:2px;color:var(--red);font-weight:700;}

  .rps{border:2.5px solid var(--ink);border-radius:16px;padding:14px;}
  .rps-row{margin-bottom:14px;}
  .rps-row:last-of-type{margin-bottom:0;}
  .rps-nm{font-size:12px;letter-spacing:2px;color:#8a8a8a;margin-bottom:8px;}
  .hands{display:flex;gap:9px;}
  .hands button{flex:1;aspect-ratio:1.6;border:2px solid var(--ink);background:none;border-radius:13px;
    font-family:inherit;font-size:19px;font-weight:700;color:var(--ink2);}
  .hands button:active{background:var(--yellow);}
  .picked{display:none;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--red);
    border:2px dashed var(--red);border-radius:13px;text-align:center;padding:13px;}
  .rps-row.done .hands{display:none;}
  .rps-row.done .picked{display:block;}
  .rps.over .rps-row{display:none;}
  .showbtn{display:none;width:100%;margin-top:14px;border:2.5px solid var(--red);background:var(--red);
    color:#fff;border-radius:999px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:4px;padding:12px;}
  .showbtn:active{transform:scale(.97);}
  .rps.ready .showbtn{display:block;}
  .rps.over .showbtn{display:none;}

  .reveal{display:none;}
  .rps.over .reveal{display:block;animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
  .hands-show{display:flex;align-items:center;justify-content:center;gap:18px;}
  .hands-show>div{text-align:center;}
  .hands-show i{display:flex;align-items:center;justify-content:center;width:72px;height:72px;
    border:3px solid var(--ink);border-radius:50%;font-size:30px;font-weight:800;font-style:normal;margin-bottom:7px;}
  .hands-show span{font-size:11px;letter-spacing:2px;color:#8a8a8a;}
  .hands-show .mid{color:#d4d4d4;font-size:20px;align-self:flex-start;margin-top:26px;}
  .verdict{text-align:center;font-size:20px;font-weight:800;letter-spacing:3px;margin:16px 0 4px;color:var(--red);}
  .rps-f{display:flex;gap:10px;margin-top:14px;}
  .rps-f button{flex:1;border:2.5px solid var(--ink);background:none;border-radius:999px;
    font-family:inherit;font-size:13px;font-weight:600;letter-spacing:1px;color:var(--ink2);padding:10px;}
  .rps-f .primary{background:var(--red);border-color:var(--red);color:#fff;}
  .rps-f button:disabled{opacity:.35;}

  /* ===== 附近收藏 ===== */
  .near{width:min(92vw,380px);}
  .near-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .near-h{font-size:12px;letter-spacing:2px;color:#8a8a8a;}
  .near-top button{border:1.5px solid var(--ink);background:none;border-radius:999px;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--ink2);padding:6px 14px;}
  .near-top button:active{transform:scale(.95);}
  .near-st{font-size:13px;letter-spacing:1px;margin:10px 0 16px;min-height:20px;color:var(--ink2);}
  .near-st b{color:var(--red);}
  .nmap{border:2.5px solid var(--ink);border-radius:16px;padding:6px;margin-bottom:18px;}
  .nmap svg{display:block;width:100%;height:auto;}
  .nmap .pt{cursor:pointer;}
  .area{margin-bottom:16px;}
  .area-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    font-size:12px;letter-spacing:2px;color:#8a8a8a;border-bottom:1px dashed #d8d8d8;padding-bottom:6px;margin-bottom:10px;}
  .area-h b{font-size:14px;color:var(--ink2);letter-spacing:2px;}
  .area-h span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;}
  .area.top .area-h b,.area.top .area-h span:last-child{color:var(--red);}
  .plc{border:2px solid #d4d4d4;border-radius:16px;padding:13px 14px;margin-bottom:10px;scroll-margin:20px;}
  .plc.top{border:2.5px solid var(--red);}
  .plc.flash{border-color:var(--ink);}
  .plc-r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .plc-nm{font-size:16px;font-weight:700;letter-spacing:1px;}
  .plc-tag{font-size:11px;letter-spacing:1px;color:#8a8a8a;border:1px solid #d4d4d4;border-radius:999px;
    padding:0 7px;margin-left:6px;vertical-align:2px;font-weight:500;}
  .plc-d{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .plc.top .plc-d{color:var(--red);}
  .arw{display:inline-block;margin-right:5px;font-weight:700;transition:transform .15s linear;}
  .plc-nt{font-size:13px;color:#6a6a6a;margin:5px 0 10px;line-height:1.5;}
  .plc a{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;
    font-size:12px;font-weight:600;letter-spacing:1px;color:var(--ink2);text-decoration:none;}
  .plc a:active{transform:scale(.95);}
  .plc-st{font-size:12px;letter-spacing:1px;color:#6a6a6a;margin:-4px 0 10px;}
  .plc-st.warn{color:var(--red);font-weight:700;}
  .plc-st.off{color:#a8a8a8;}
  .plc-btns{display:flex;gap:8px;}
  .plc .seen{border:1.5px solid #d4d4d4;border-radius:999px;background:none;padding:5px 14px;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:1px;color:#8a8a8a;}
  .plc .seen:active{transform:scale(.95);}
  .plc.visited .plc-r1,.plc.visited .plc-nt,.plc.visited .plc-st{opacity:.45;}
  .plc.visited{border-color:#e4e4e4;}
  /* 打卡 */
  .plc .ck{border:1.5px solid var(--red);border-radius:999px;background:none;padding:5px 14px;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--red);}
  .plc .ck:active{transform:scale(.95);}
  .ckl{margin-top:12px;border-top:1px dashed #d8d8d8;padding-top:10px;display:flex;flex-direction:column;gap:12px;}
  .cke-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:#8a8a8a;}
  .cke-h button{border:none;background:none;color:#b0b0b0;font-size:11px;font-family:inherit;padding:0;}
  .cke-t{font-size:14px;line-height:1.55;margin-top:3px;white-space:pre-wrap;word-break:break-word;}
  .cke-ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .cke-ph img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1.5px solid var(--ink);}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20;display:none;}
  .sheet-bg.on{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2.5px solid var(--ink);
    border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));z-index:21;display:none;}
  .sheet.on{display:block;}
  .sheet-h{font-size:15px;font-weight:700;letter-spacing:2px;margin-bottom:12px;}
  .sheet textarea{width:100%;height:90px;border:1.5px solid #d4d4d4;border-radius:14px;padding:10px 12px;
    font-family:inherit;font-size:15px;resize:none;outline:none;color:var(--ink2);}
  .sheet textarea:focus{border-color:var(--ink);}
  .sheet-ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .sheet-ph img,.sheet-ph label{width:64px;height:64px;border-radius:10px;object-fit:cover;}
  .sheet-ph label{border:1.5px dashed var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink2);}
  .sheet-ph input{display:none;}
  .sheet-f{display:flex;gap:10px;margin-top:14px;}
  .sheet-f button{flex:1;border:2.5px solid var(--ink);background:none;border-radius:999px;padding:11px;
    font-family:inherit;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--ink2);}
  .sheet-f .primary{background:var(--red);border-color:var(--red);color:#fff;}
  .sheet-f button:disabled{opacity:.4;}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:none;align-items:center;justify-content:center;}
  .viewer.on{display:flex;}
  .viewer img{max-width:100%;max-height:100%;}
  .plc.visited .seen{border-color:var(--ink);color:var(--ink2);}
</style>
</head>
<body>

<div class="page on" id="page-wheel">
<header>
  <h1>今天吃什么喵</h1>
  <div class="sub" id="sub">TAP TO SPIN</div>
  <div class="cdown" id="cdown"></div>
  <div class="rush-tip" id="rushTip"></div>
</header>

<div class="stage">
  <svg viewBox="0 0 400 400" id="svg">
    <g stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- 猫耳：小而圆，白填充 -->
      <path fill="#fff" d="M98 108 Q80 56 97 34 Q134 50 152 74 Z"/>
      <path fill="#fff" d="M302 108 Q320 56 303 34 Q266 50 248 74 Z"/>
      <!-- 胡须（圆外两侧，各三根） -->
      <g fill="none" stroke-width="3">
        <path d="M49 188 Q28 178 6 169"/>
        <path d="M50 201 Q26 201 1 198"/>
        <path d="M49 214 Q28 223 6 232"/>
        <path d="M351 188 Q372 178 394 169"/>
        <path d="M350 201 Q374 201 399 198"/>
        <path d="M351 214 Q372 223 394 232"/>
      </g>
      <!-- 外圈 -->
      <circle cx="200" cy="200" r="150" fill="#fff"/>
      <!-- 蝴蝶结：戴在（她的）左耳，视觉右上 -->
      <g transform="translate(280 80) rotate(30) scale(1.18)" fill="var(--red)">
        <path d="M0 0 C-8 -24 -34 -26 -34 -4 C-34 20 -8 22 0 0 Z"/>
        <path d="M0 0 C8 -24 34 -26 34 -4 C34 20 8 22 0 0 Z"/>
        <circle cx="0" cy="-1" r="8"/>
      </g>
      <!-- 指针 -->
      <path id="pin" d="M200 58 L186 22 L214 22 Z" fill="var(--red)"/>
    </g>
    <!-- 转盘本体 -->
    <g class="rotor" id="rotor"></g>
  </svg>
  <button id="spin">转</button>
</div>

<div class="result" id="res"></div>
<button id="again" class="again">不乐意，重抽！</button>

<div class="panel">
  <button class="toggle" id="tg">编辑选项</button>
  <div class="list" id="list"></div>
  <div class="add" id="addBox">
    <input id="inp" placeholder="添加想吃的…" maxlength="8">
    <button id="addBtn">添加</button>
  </div>
</div>
</div><!-- /page-wheel -->

<div class="page" id="page-game">
  <div class="list-wrap">
    <div class="sec-title">积分</div>
    <div class="score">
      <div class="sbox">
        <span class="nm" data-nm="a">包包</span>
        <b id="sa">0</b>
        <div class="sops"><button data-dec="a">−</button><button data-inc="a">＋</button></div>
      </div>
      <div class="vs">VS</div>
      <div class="sbox">
        <span class="nm" data-nm="b">秀秀</span>
        <b id="sb">0</b>
        <div class="sops"><button data-dec="b">−</button><button data-inc="b">＋</button></div>
      </div>
    </div>
    <div class="tools"><button id="scReset">重置比分</button></div>

    <div class="sec-title" style="margin-top:26px">石头剪刀布</div>
    <div class="rps">
      <div class="rps-row" id="rowA">
        <div class="rps-nm"><span data-nm2="a">包包</span> 出拳</div>
        <div class="hands"><button data-h="a" data-v="石">石</button><button data-h="a" data-v="剪">剪</button><button data-h="a" data-v="布">布</button></div>
        <div class="picked">已出拳 ✓</div>
      </div>
      <div class="rps-row" id="rowB">
        <div class="rps-nm"><span data-nm2="b">秀秀</span> 出拳</div>
        <div class="hands"><button data-h="b" data-v="石">石</button><button data-h="b" data-v="剪">剪</button><button data-h="b" data-v="布">布</button></div>
        <div class="picked">已出拳 ✓</div>
      </div>
      <button id="showBtn" class="showbtn">揭晓</button>
      <div class="reveal" id="reveal">
        <div class="hands-show">
          <div><i id="ha">石</i><span data-nm3="a">包包</span></div>
          <div class="mid">—</div>
          <div><i id="hb">布</i><span data-nm3="b">秀秀</span></div>
        </div>
        <div class="verdict" id="verdict">平局</div>
        <div class="rps-f">
          <button id="winAdd">胜者 +1</button>
          <button id="rpsAgain" class="primary">再来一局</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page-near">
  <div class="near">
    <div class="near-top">
      <div class="near-h">附近收藏</div>
      <button id="nearBtn">刷新位置</button>
    </div>
    <div class="near-st" id="nearSt"></div>
    <div class="nmap"><svg viewBox="0 0 340 340" id="nearMap"></svg></div>
    <div id="nearList"></div>
  </div>
</div>

<div class="sheet-bg" id="ckBg"></div>
<div class="sheet" id="ckSheet">
  <div class="sheet-h" id="ckTitle">打卡</div>
  <textarea id="ckText" maxlength="300" placeholder="写一句…"></textarea>
  <div class="sheet-ph" id="ckPh"><label>＋<input type="file" id="ckFile" accept="image/*" multiple></label></div>
  <div class="sheet-f"><button id="ckCancel">取消</button><button id="ckSave" class="primary">打卡</button></div>
</div>
<div class="viewer" id="viewer"><img alt=""></div>

<nav class="tabs">
  <button data-page="wheel" class="on">转盘</button>
  <button data-page="game">对战</button>
  <button data-page="near">探索</button>
</nav>

<script>
/* 从 2026-08-30 起算，每次打开显示第几天 */
(function(){
  const start=new Date(2026,7,30);           // 月份从 0 开始，7 = 8月
  const now=new Date();
  const d0=new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const d1=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((d1-d0)/86400000)+1; // 8月30日当天算第 1 天
  document.getElementById("sub").textContent=days+" · TAP TO SPIN";
})();

function draw(){

  const n=items.length;if(!n)return;
  const step=2*Math.PI/n;
  const g=document.createElementNS(NS,"g");
  g.setAttribute("fill","none");
  g.setAttribute("stroke","var(--ink)");
  g.setAttribute("stroke-width","2");
  g.setAttribute("stroke-linecap","round");

  for(let i=0;i<n;i++){

    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("x1",CX+Math.cos(a)*46);ln.setAttribute("y1",CY+Math.sin(a)*46);
    ln.setAttribute("x2",CX+Math.cos(a)*R);ln.setAttribute("y2",CY+Math.sin(a)*R);
    g.appendChild(ln);
  }
  rotor.appendChild(g);
  for(let i=0;i<n;i++){
    const mid=(i+.5)*step-Math.PI/2;
    const deg=mid*180/Math.PI;
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",CX+Math.cos(mid)*(R-16));

  let a=Math.atan2(m.b,m.a)*180/Math.PI;

function wgs2gcj(lat,lng){
  const a=6378245,ee=0.00669342162296594323,PI=Math.PI;
  const tl=(x,y)=>{let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
    r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r;};
  const tg=(x,y)=>{let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
    r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;};
  let dLat=tl(lng-105,lat-35),dLng=tg(lng-105,lat-35);
  const rad=lat/180*PI;let m=Math.sin(rad);m=1-ee*m*m;const sm=Math.sqrt(m);
  dLat=dLat*180/((a*(1-ee))/(m*sm)*PI);dLng=dLng*180/(a/sm*Math.cos(rad)*PI);
  return [lat+dLat,lng+dLng];
}
function dist(la1,lo1,la2,lo2){
  const R=6371000,r=Math.PI/180,dl=(la2-la1)*r,dg=(lo2-lo1)*r;
  const h=Math.sin(dl/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

    const g=svgEl("g",{class:"pt"});
    const seen=isVisited(p);
    g.appendChild(svgEl("circle",{cx:x,cy:y,r:5.5,fill:"#fff",stroke:seen?"#c4c4c4":"var(--ink)","stroke-width":2.5}));
    if(pick){
      boxes.push(pick[3]);
      g.appendChild(svgEl("text",{x:pick[1],y:pick[2],"text-anchor":pick[0],"font-size":FS,
        "font-weight":top?700:500,fill:top?"var(--red)":seen?"#b0b0b0":"var(--ink2)","font-family":"-apple-system,PingFang SC,sans-serif"},label));
    }
    g.addEventListener("click",()=>jumpTo(p.id));
    svg.appendChild(g);
    if(youBox){boxes.push(youBox);youBox=null;} /* 最近的那个先放好名字，再把“你”的位置挡上 */
  });
  /* 自己的位置 */
  if(here){
    const [x,y]=P(here);
    svg.appendChild(svgEl("circle",{cx:x,cy:y,r:11,fill:"none",stroke:"var(--red)","stroke-width":1.5,opacity:.5}));
    svg.appendChild(svgEl("circle",{cx:x,cy:y,r:5,fill:"var(--red)"}));
    /* 旁边写个“你”，找个不挡字的位置 */
    const spots=[["start",x+15,y+4],["end",x-15,y+4],["middle",x,y-16],["middle",x,y+24]];
    let sp=spots.find(([a,tx,ty])=>{const x0=a==="start"?tx:a==="end"?tx-12:tx-6;return !hit([x0,ty-11,x0+12,ty+3]);});
    if(sp)svg.appendChild(svgEl("text",{x:sp[1],y:sp[2],"text-anchor":sp[0],"font-size":12,"font-weight":700,fill:"var(--red)",
      "font-family":"-apple-system,PingFang SC,sans-serif"},"你"));
  }
  /* 指北 + 比例尺 */
  const na=svgEl("g",{transform:"rotate("+(-h)+" 318 26)"});
  na.appendChild(svgEl("path",{d:"M318 34 L318 14 M312 21 L318 14 L324 21",stroke:h?"var(--red)":"var(--ink)","stroke-width":1.8,fill:"none","stroke-linecap":"round"}));
  svg.appendChild(na);
  const nx=318+Math.sin(-hr)*20,ny=26-Math.cos(-hr)*20;
  if(h)svg.appendChild(svgEl("text",{x:nx,y:ny+4,"text-anchor":"middle","font-size":10,fill:"var(--red)","font-weight":700},"北"));
  else svg.appendChild(svgEl("text",{x:318,y:46,"text-anchor":"middle","font-size":10,fill:"#8a8a8a"},"北"));
  const nice=[50,100,200,250,500,1000,2000,5000].find(v=>v*s>=50)||5000;
  svg.appendChild(svgEl("line",{x1:14,y1:H-14,x2:14+nice*s,y2:H-14,stroke:"#8a8a8a","stroke-width":2}));
  svg.appendChild(svgEl("text",{x:14+nice*s/2,y:H-20,"text-anchor":"middle","font-size":10,fill:"#8a8a8a"},nice<1000?nice+" 米":nice/1000+" 公里"));
}
function paintNear(here){
  const list=PLACES.map(p=>({...p,d:here&&p.lat!=null?dist(here[0],here[1],p.lat,p.lng):null}));
  const byD=(x,y)=>isVisited(x)-isVisited(y)||(x.d==null)-(y.d==null)||(x.d-y.d);
  const ranked=list.filter(p=>p.d!=null).sort(byD);
  const far=here&&(!ranked.length||Math.min(...ranked.map(p=>p.d))>FAR);
  const nearestId=here&&!far?ranked[0].id:null;
  paintMap(far?null:here,nearestId);
  /* 片区排序：有定位按片区里最近那个点的距离，没定位按 AREAS 顺序；没位置的片区永远在最后 */
  const groups=AREAS.map(a=>({a,ps:list.filter(p=>p.area===a)})).filter(g=>g.ps.length);
  if(here){
    groups.forEach(g=>{g.ps.sort(byD);g.min=g.ps[0].d==null?Infinity:g.ps[0].d;});
    groups.sort((x,y)=>x.min-y.min);
  }else groups.forEach(g=>g.ps.sort((x,y)=>isVisited(x)-isVisited(y)));
  const box=document.getElementById("nearList");box.innerHTML="";
  groups.forEach((g,gi)=>{
    const sec=document.createElement("div");
    sec.className="area"+(nearestId&&gi===0?" top":"");
    const h=document.createElement("div");h.className="area-h";
    const l=document.createElement("span");
    const b=document.createElement("b");b.textContent=AREA_TITLE[g.a]||g.a+"这片";
    l.append(b," · "+g.ps.length+" 个点");
    const r=document.createElement("span");
    const f=g.ps[0];
    if(here&&!far&&f.d!=null){
      r.append(arrow(bearingOf(here[0],here[1],f.lat,f.lng)),dirOf(here[0],here[1],f.lat,f.lng)+" "+fmtD(f.d));
    }
    h.append(l,r);sec.appendChild(h);
    g.ps.forEach(p=>sec.appendChild(card(p,p.id===nearestId,here&&!far&&p.d!=null)));
    box.appendChild(sec);
  });
  const st=document.getElementById("nearSt");st.innerHTML="";
  if(far){
    st.textContent=ranked.length?"离这些收藏还有 "+fmtD(Math.min(...ranked.map(p=>p.d)))+"，到了再刷新":"";
  }else if(here){
    const f=ranked[0];
    st.append("离你最近：");const b=document.createElement("b");b.textContent=f.name;st.append(b," · "+fmtD(f.d));
  }
}
/* 开放状态：hours=[开门,关门]，closedOn=[星期几闭馆，0=周日] */
function openState(p,now){
  if(!p.hours)return null;
  const mins=t=>{const [h,m]=t.split(":");return h*60+ +m;};
  const o=mins(p.hours[0]),c=mins(p.hours[1]),n=now.getHours()*60+now.getMinutes();
  if(p.closedOn&&p.closedOn.includes(now.getDay()))return {cls:"off",txt:"今天闭馆"};
  if(n<o)return {cls:"",txt:"还没开门 · "+p.hours[0]+" 开"};
  if(n>=c)return {cls:"off",txt:"已关门 · 开放到 "+p.hours[1]};
  if(c-n<=60)return {cls:"warn",txt:"还有 "+(c-n)+" 分钟关门"};
  return {cls:"",txt:"开放中 · "+p.hours[1]+" 关门"};
}
/* 去过：存在本机，按地名记 */
let visited={};try{visited=JSON.parse(localStorage.getItem("kw_visited")||"{}");}catch(e){}
const isVisited=p=>!!visited[p.name];
let CK={},ckDB=null; /* 打卡数据，见文件末尾 */
function toggleVisited(p){
  if(visited[p.name])delete visited[p.name];else visited[p.name]=1;
  try{localStorage.setItem("kw_visited",JSON.stringify(visited));}catch(e){}
  const st=document.getElementById("nearSt"),keep=gotFix?null:st.textContent;
  paintNear(gotFix?lastHere:null);
  if(keep!==null)st.textContent=keep;
}
function card(p,top,showD){
    const el=document.createElement("div");
    el.id=p.id;
    el.className="plc"+(top?" top":"")+(isVisited(p)?" visited":"");
    const url=p.lat!=null
      ?"https://uri.amap.com/marker?position="+p.lng+","+p.lat+"&name="+encodeURIComponent(p.name)+"&src=kittywheel&coordinate=gaode&callnative=1"
      :"https://uri.amap.com/search?keyword="+encodeURIComponent(p.name)+"&city=330400&src=kittywheel&callnative=1";
    el.innerHTML='<div class="plc-r1"><div class="plc-nm"></div><div class="plc-d"></div></div><div class="plc-nt"></div>'+
      '<div class="plc-btns"><a target="_blank" rel="noopener">高德打开</a><button class="ck">打卡</button><button class="seen"></button></div>';
    el.querySelector(".plc-nm").textContent=p.name;
    const tag=document.createElement("span");tag.className="plc-tag";tag.textContent=p.tag;
    el.querySelector(".plc-nm").appendChild(tag);
    if(showD&&lastHere){const pd=el.querySelector(".plc-d");pd.append(arrow(bearingOf(lastHere[0],lastHere[1],p.lat,p.lng)),fmtD(p.d));}
    el.querySelector(".plc-nt").textContent=p.note;
    const st=openState(p,new Date());
    if(st){
      const d=document.createElement("div");d.className="plc-st "+st.cls;d.textContent=st.txt;
      el.querySelector(".plc-nt").after(d);
    }
    el.querySelector("a").href=url;
    if(p.lat==null)el.querySelector("a").textContent="高德搜索";
    const sb=el.querySelector(".seen");
    sb.textContent=isVisited(p)?"去过 ✓":"去过";
    sb.onclick=()=>toggleVisited(p);
    el.querySelector(".ck").onclick=()=>openCheckin(p);
    const mine=(CK[p.name]||[]);
    if(mine.length){
      const box=document.createElement("div");box.className="ckl";
      mine.forEach(e=>box.appendChild(ckEntry(e)));
      el.appendChild(box);
    }
    return el;
}
/* ========== 指南针：跟着手机转 ========== */
let HEAD=null,compOn=false,compType=null,drawnHead=null,drawT=0;
function arrow(b){const a=document.createElement("span");a.className="arw";a.dataset.b=b;a.textContent="↑";
  a.style.transform="rotate("+((b-(HEAD||0))|0)+"deg)";return a;}
function applyHeading(){
  document.querySelectorAll(".arw").forEach(a=>{a.style.transform="rotate("+((+a.dataset.b-(HEAD||0))|0)+"deg)";});
  const now=performance.now();
  if(drawnHead==null||Math.abs(((HEAD-drawnHead+540)%360)-180)>2){
    if(now-drawT>120){drawT=now;drawnHead=HEAD;if(lastMap[0])paintMap(lastMap[0],lastMap[1]);}
  }
}
function onOrient(e){
  let h=null;
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;          /* iPhone */
  else if((e.absolute||e.type==="deviceorientationabsolute")&&e.alpha!=null)h=360-e.alpha; /* 安卓 */
  if(h==null)return;
  h+=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  h=(h%360+360)%360;
  if(HEAD==null)HEAD=h;
  else{const d=((h-HEAD+540)%360)-180;HEAD=(HEAD+d*.3+360)%360;}   /* 平滑一下，免得抖 */
  requestAnimationFrame(applyHeading);
}
function startCompass(){
  if(compOn)return;
  const listen=()=>{
    compType="ondeviceorientationabsolute" in window?"deviceorientationabsolute":"deviceorientation";
    window.addEventListener(compType,onOrient);compOn=true;
  };
  const D=window.DeviceOrientationEvent;
  if(!D)return;
  if(typeof D.requestPermission==="function"){            /* iPhone 要点一下授权 */
    D.requestPermission().then(r=>{if(r==="granted")listen();}).catch(()=>{});
  }else listen();
}
function stopCompass(){
  if(compOn){window.removeEventListener(compType,onOrient);compOn=false;}
}
/* 停在「附近」页时持续定位，走动 10 米以上就重画；离开页面或锁屏就停 */
let watchId=null,lastHere=null,gotFix=false;
const nearOn=()=>document.getElementById("page-near").classList.contains("on");
function setLive(on){document.querySelector(".near-h").textContent=on?"附近收藏 · 跟着你走":"附近收藏";}
function onPos(pos){
  const here=wgs2gcj(pos.coords.latitude,pos.coords.longitude);
  if(lastHere&&dist(lastHere[0],lastHere[1],here[0],here[1])<10&&gotFix)return;
  lastHere=here;gotFix=true;setLive(true);
  paintNear(here);
}
function onErr(e){
  /* 没授权才停；信号弱、超时这类临时问题继续等，保留上一次的结果 */
  if(e&&e.code===1){
    stopWatch();
    if(!gotFix){paintNear(null);document.getElementById("nearSt").textContent="定位没打开，先按路线顺序排";}
  }else if(!gotFix){
    document.getElementById("nearSt").textContent="定位信号弱，再等等…";
  }
}
function startWatch(){
  if(!navigator.geolocation){paintNear(null);document.getElementById("nearSt").textContent="这个浏览器拿不到定位，先按路线顺序排";return;}
  if(watchId!==null)return;
  if(!gotFix)document.getElementById("nearSt").textContent="定位中…";
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
function stopWatch(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  setLive(false);
}
paintNear(null);
setInterval(()=>{if(nearOn())paintNear(gotFix?lastHere:null);},60000); /* 每分钟刷新开放状态 */
document.getElementById("nearBtn").onclick=()=>{stopWatch();lastHere=null;startWatch();startCompass();};
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.page==="near"){startWatch();startCompass();}else{stopWatch();stopCompass();}
}));
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopWatch();stopCompass();}else if(nearOn()){startWatch();startCompass();}
});

/* ========== 见面倒计时 ========== */
/* 改下次见面时间只改这一行：月份从 0 开始，9 = 10月；过了时间自动隐藏 */
const MEET=new Date(2026,9,24,9,30);
const MEET_PLACE="嘉兴";
(function(){
  const el=document.getElementById("cdown"),tip=document.getElementById("rushTip");
  const p=n=>String(n).padStart(2,"0");
  const fmt=t=>p(Math.floor(t/3600))+":"+p(Math.floor(t%3600/60))+":"+p(t%60);
  el.innerHTML='<span class="cd-place"></span><span class="t"></span>';
  el.firstChild.textContent=MEET_PLACE+" · ";
  const tEl=el.lastChild;
  let rushing=false;
  const left=()=>Math.ceil((MEET-new Date())/1000);
  function tick(){
    const t=left();
    if(t<=0){el.textContent="";tip.textContent="";return;}
    if(!rushing)tEl.textContent=fmt(t);
    setTimeout(tick,1000-Date.now()%1000+20);
  }
  tick();

  /* 点一下＝催一下：时间往前狂奔，然后被弹回来 */
  let n=0;try{n=+localStorage.getItem("kw_rush")||0;}catch(e){}
  let tipT=0;
  el.addEventListener("click",()=>{
    if(rushing||left()<=0)return;
    rushing=true;el.classList.add("rush");
    n++;try{localStorage.setItem("kw_rush",n);}catch(e){}
    if(navigator.vibrate)navigator.vibrate(15);
    const real=left(),jump=Math.min(real-1,Math.floor(real*0.6)),t0=performance.now(),D=650;
    (function run(now){
      const k=Math.min(1,(now-t0)/D),e=k*k;            /* 越跑越快 */
      tEl.textContent=fmt(real-Math.floor(jump*e));
      if(k<1){requestAnimationFrame(run);return;}
      setTimeout(()=>{                                  /* 停一下，再弹回真实时间 */
        tEl.textContent=fmt(left());
        el.classList.remove("rush");rushing=false;
        if(navigator.vibrate)navigator.vibrate([10,40,10]);
        tip.textContent="心急如焚焚焚 +"+n;
        tip.classList.add("on");clearTimeout(tipT);
        tipT=setTimeout(()=>tip.classList.remove("on"),2200);
      },220);
    })(t0);
  });
})();

/* ========== 打卡（先存本机，以后同步到服务器） ========== */
/* 每条：{id, place, text, photos:[Blob], time, synced:false} 存在 IndexedDB */
const URLS=new Map(); /* Blob -> 预览地址，避免重复生成 */
const blobURL=b=>{if(!URLS.has(b))URLS.set(b,URL.createObjectURL(b));return URLS.get(b);};
function dbOpen(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej("no idb");
    const r=indexedDB.open("kitty-wheel",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("checkins",{keyPath:"id"});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
function dbAll(){return new Promise((res,rej)=>{const q=ckDB.transaction("checkins").objectStore("checkins").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function dbPut(e){return new Promise((res,rej)=>{const t=ckDB.transaction("checkins","readwrite");t.objectStore("checkins").put(e);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
function dbDel(id){return new Promise((res,rej)=>{const t=ckDB.transaction("checkins","readwrite");t.objectStore("checkins").delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
function ckIndex(all){
  CK={};all.sort((a,b)=>b.time-a.time).forEach(e=>(CK[e.place]=CK[e.place]||[]).push(e));
}
const repaint=()=>{
  const st=document.getElementById("nearSt"),keep=gotFix?null:st.textContent;
  paintNear(gotFix?lastHere:null);
  if(keep!==null)st.textContent=keep;
};
dbOpen().then(db=>{ckDB=db;return dbAll();}).then(all=>{ckIndex(all);repaint();}).catch(()=>{});

function ckEntry(e){
  const d=document.createElement("div");
  const t=new Date(e.time),p2=n=>String(n).padStart(2,"0");
  d.innerHTML='<div class="cke-h"><span></span><button>删除</button></div>';
  d.querySelector("span").textContent=(t.getMonth()+1)+"/"+t.getDate()+" "+p2(t.getHours())+":"+p2(t.getMinutes());
  d.querySelector("button").onclick=async()=>{
    if(!confirm("删除这条打卡？"))return;
    await dbDel(e.id);ckIndex(await dbAll());repaint();
  };
  if(e.text){const x=document.createElement("div");x.className="cke-t";x.textContent=e.text;d.appendChild(x);}
  if(e.photos&&e.photos.length){
    const ph=document.createElement("div");ph.className="cke-ph";
    e.photos.forEach(b=>{const im=document.createElement("img");im.src=blobURL(b);im.onclick=()=>view(im.src);ph.appendChild(im);});
    d.appendChild(ph);
  }
  return d;
}
function view(src){const v=document.getElementById("viewer");v.querySelector("img").src=src;v.classList.add("on");}
document.getElementById("viewer").onclick=()=>document.getElementById("viewer").classList.remove("on");

/* 照片压缩：长边 1280，JPEG 0.8 */
async function shrink(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"});}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});}
  const w=bmp.width,h=bmp.height,k=Math.min(1,1280/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,"image/jpeg",.8));
}

let ckPlace=null,ckPhotos=[];
function openCheckin(p){
  if(!ckDB){alert("这个浏览器存不了打卡，换手机自带浏览器试试");return;}
  ckPlace=p;ckPhotos=[];
  document.getElementById("ckTitle").textContent="打卡 · "+p.name;
  document.getElementById("ckText").value="";
  paintPh();
  document.getElementById("ckBg").classList.add("on");
  document.getElementById("ckSheet").classList.add("on");
}
function closeCheckin(){
  document.getElementById("ckBg").classList.remove("on");
  document.getElementById("ckSheet").classList.remove("on");
}
function paintPh(){
  const box=document.getElementById("ckPh");
  box.querySelectorAll("img").forEach(x=>x.remove());
  const add=box.querySelector("label");
  ckPhotos.forEach((b,i)=>{
    const im=document.createElement("img");im.src=blobURL(b);
    im.onclick=()=>{ckPhotos.splice(i,1);paintPh();}; /* 点一下去掉这张 */
    box.insertBefore(im,add);
  });
  add.style.display=ckPhotos.length>=6?"none":"";
}
document.getElementById("ckFile").onchange=async ev=>{
  const files=[...ev.target.files].slice(0,6-ckPhotos.length);ev.target.value="";
  const btn=document.getElementById("ckSave");btn.disabled=true;btn.textContent="处理照片…";
  for(const f of files){try{ckPhotos.push(await shrink(f));}catch(e){}}
  btn.disabled=false;btn.textContent="打卡";paintPh();
};
document.getElementById("ckCancel").onclick=closeCheckin;
document.getElementById("ckBg").onclick=closeCheckin;
document.getElementById("ckSave").onclick=async()=>{
  const text=document.getElementById("ckText").value.trim();
  if(!text&&!ckPhotos.length){closeCheckin();return;}
  const e={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),place:ckPlace.name,text,photos:ckPhotos.slice(),time:Date.now(),synced:false};
  try{await dbPut(e);}catch(err){alert("没存上，可能手机空间不够");return;}
  if(!visited[ckPlace.name]){visited[ckPlace.name]=1;try{localStorage.setItem("kw_visited",JSON.stringify(visited));}catch(_){}}
  ckIndex(await dbAll());closeCheckin();repaint();
  if(navigator.vibrate)navigator.vibrate(15);
};
