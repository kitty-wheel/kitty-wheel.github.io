<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>今天吃什么喵</title>
<style>
  :root{
    --ink:#2b2b2b;      /* 线条色 */
    --ink2:#2b2b2b;     /* 文字色 */
    --bg:#ffffff;
    --red:#e60012;      /* 蝴蝶结红（正红） */
    --yellow:#f5c518;   /* 鼻子黄 */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
    background:var(--bg);color:var(--ink2);
    display:flex;flex-direction:column;align-items:center;
    padding:calc(24px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));
  }
  .page{display:none;width:100%;flex-direction:column;align-items:center;flex:1;}
  .page.on{display:flex;}
  header{text-align:center;}
  h1{font-size:22px;font-weight:600;letter-spacing:3px;color:var(--ink2);}
  .sub{font-size:11px;letter-spacing:3px;color:var(--red);margin-top:8px;}

  .stage{position:relative;width:min(86vw,340px);margin-top:26px;}
  .stage svg{display:block;width:100%;height:auto;overflow:visible;}
  .rotor{transition:transform 4.8s cubic-bezier(.15,.72,.12,1);transform-origin:200px 200px;}

  #spin{
    position:absolute;left:50%;top:calc(50% + 6px);transform:translate(-50%,-50%);
    width:27%;aspect-ratio:1.25;border-radius:50%;
    border:3px solid var(--ink);background:var(--yellow);
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:2px;color:var(--ink2);
    cursor:pointer;z-index:3;
  }
    #spin:active{transform:translate(-50%,-50%) scale(.92);}
  #spin:disabled{opacity:.45;}

  #pin{transform-box:view-box;transform-origin:200px 24px;transition:transform .07s ease-out;}

  .result{position:relative;margin-top:30px;font-size:19px;font-weight:600;letter-spacing:2px;min-height:46px;display:flex;align-items:center;justify-content:center;}
  .result span{border:2.5px solid var(--ink);background:var(--red);color:#fff;border-radius:999px;padding:8px 24px;animation:pop .4s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

  /* 爪印爆开 */
  .burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;}
  .burst svg{position:absolute;width:22px;height:22px;left:-11px;top:-11px;
    animation:paw .85s cubic-bezier(.18,.9,.3,1) forwards;}
  @keyframes paw{
    0%{transform:translate(0,0) scale(.2) rotate(0);opacity:0}
    25%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rz));opacity:0}
  }

  .again{display:none;margin-top:14px;border:2.5px solid var(--ink);background:#fff;color:var(--ink2);
    border-radius:999px;padding:9px 22px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:1px;}
  .again.on{display:block;}
  .again:active{transform:scale(.95);}

  .panel{width:min(92vw,380px);margin-top:auto;padding-top:26px;}
  .toggle{width:100%;background:none;border:1.5px dashed var(--ink);border-radius:999px;
    color:var(--ink2);font-family:inherit;font-size:13px;letter-spacing:2px;padding:10px;}
  .list{display:none;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .list.on{display:flex;}
  .chip{border:1.5px solid #d4d4d4;border-radius:999px;padding:6px 8px 6px 13px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .chip button{border:none;background:none;color:#a8a8a8;font-size:15px;line-height:1;}
  .add{display:none;gap:10px;margin-top:12px;}
  .add input{flex:1;border:1.5px solid #d4d4d4;border-radius:999px;background:none;padding:9px 16px;
    font-size:15px;font-family:inherit;outline:none;color:var(--ink2);}
  .add input::placeholder{color:#bdbdbd;}
  .add button{border:1.5px solid var(--ink);border-radius:999px;background:none;color:var(--ink2);
    font-family:inherit;font-size:14px;font-weight:600;padding:0 20px;}

  /* ===== 底部标签栏 ===== */
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);
    border-top:2.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);z-index:9;}
  .tabs button{flex:1;background:none;border:none;font-family:inherit;padding:11px 0 13px;
    font-size:12px;letter-spacing:2px;color:#b0b0b0;position:relative;}
  .tabs button.on{color:var(--ink2);font-weight:700;}
  .tabs button.on::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:18px;height:2.5px;border-radius:2px;background:var(--red);}
  .tabs .dot{position:absolute;top:8px;margin-left:3px;width:7px;height:7px;border-radius:50%;background:var(--red);}

  /* ===== 对战 ===== */
  .score{display:flex;align-items:center;gap:10px;}
  .sbox{flex:1;border:2.5px solid var(--ink);border-radius:16px;padding:14px 10px 12px;text-align:center;}
  .sbox .nm{display:block;font-size:12px;letter-spacing:2px;color:#8a8a8a;
    border-bottom:1px dashed #d8d8d8;padding-bottom:5px;margin-bottom:8px;}
  .sbox b{display:block;font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .sops{display:flex;gap:8px;margin-top:11px;}
  .sops button{flex:1;border:2px solid var(--ink);background:none;border-radius:999px;
    font-family:inherit;font-size:17px;font-weight:700;color:var(--ink2);padding:5px 0;}
  .sops button:last-child{background:var(--yellow);}
  .sops button:active{transform:scale(.93);}
  .vs{font-size:11px;letter-spacing:2px;color:var(--red);font-weight:700;}

  .rps{border:2.5px solid var(--ink);border-radius:16px;padding:14px;}
  .rps-row{margin-bottom:14px;}
  .rps-row:last-of-type{margin-bottom:0;}
  .rps-nm{font-size:12px;letter-spacing:2px;color:#8a8a8a;margin-bottom:8px;}
  .hands{display:flex;gap:9px;}
  .hands button{flex:1;aspect-ratio:1.6;border:2px solid var(--ink);background:none;border-radius:13px;
    font-family:inherit;font-size:19px;font-weight:700;color:var(--ink2);}
  .hands button:active{background:var(--yellow);}
  .picked{display:none;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--red);
    border:2px dashed var(--red);border-radius:13px;text-align:center;padding:13px;}
  .rps-row.done .hands{display:none;}
  .rps-row.done .picked{display:block;}
  .rps.over .rps-row{display:none;}
  .showbtn{display:none;width:100%;margin-top:14px;border:2.5px solid var(--red);background:var(--red);
    color:#fff;border-radius:999px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:4px;padding:12px;}
  .showbtn:active{transform:scale(.97);}
  .rps.ready .showbtn{display:block;}
  .rps.over .showbtn{display:none;}

  .reveal{display:none;}
  .rps.over .reveal{display:block;animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
  .hands-show{display:flex;align-items:center;justify-content:center;gap:18px;}
  .hands-show>div{text-align:center;}
  .hands-show i{display:flex;align-items:center;justify-content:center;width:72px;height:72px;
    border:3px solid var(--ink);border-radius:50%;font-size:30px;font-weight:800;font-style:normal;margin-bottom:7px;}
  .hands-show span{font-size:11px;letter-spacing:2px;color:#8a8a8a;}
  .hands-show .mid{color:#d4d4d4;font-size:20px;align-self:flex-start;margin-top:26px;}
  .verdict{text-align:center;font-size:20px;font-weight:800;letter-spacing:3px;margin:16px 0 4px;color:var(--red);}
  .rps-f{display:flex;gap:10px;margin-top:14px;}
  .rps-f button{flex:1;border:2.5px solid var(--ink);background:none;border-radius:999px;
    font-family:inherit;font-size:13px;font-weight:600;letter-spacing:1px;color:var(--ink2);padding:10px;}
  .rps-f .primary{background:var(--red);border-color:var(--red);color:#fff;}
  .rps-f button:disabled{opacity:.35;}
</style>
</head>
<body>

<div class="page on" id="page-wheel">
<header>
  <h1>今天吃什么喵</h1>
  <div class="sub" id="sub">TAP TO SPIN</div>
</header>

<div class="stage">
  <svg viewBox="0 0 400 400" id="svg">
    <g stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- 猫耳：小而圆，白填充 -->
      <path fill="#fff" d="M98 108 Q80 56 97 34 Q134 50 152 74 Z"/>
      <path fill="#fff" d="M302 108 Q320 56 303 34 Q266 50 248 74 Z"/>
      <!-- 胡须（圆外两侧，各三根） -->
      <g fill="none" stroke-width="3">
        <path d="M49 188 Q28 178 6 169"/>
        <path d="M50 201 Q26 201 1 198"/>
        <path d="M49 214 Q28 223 6 232"/>
        <path d="M351 188 Q372 178 394 169"/>
        <path d="M350 201 Q374 201 399 198"/>
        <path d="M351 214 Q372 223 394 232"/>
      </g>
      <!-- 外圈 -->
      <circle cx="200" cy="200" r="150" fill="#fff"/>
      <!-- 蝴蝶结：戴在（她的）左耳，视觉右上 -->
      <g transform="translate(280 80) rotate(30) scale(1.18)" fill="var(--red)">
        <path d="M0 0 C-8 -24 -34 -26 -34 -4 C-34 20 -8 22 0 0 Z"/>
        <path d="M0 0 C8 -24 34 -26 34 -4 C34 20 8 22 0 0 Z"/>
        <circle cx="0" cy="-1" r="8"/>
      </g>
      <!-- 指针 -->
      <path id="pin" d="M200 58 L186 22 L214 22 Z" fill="var(--red)"/>
    </g>
    <!-- 转盘本体 -->
    <g class="rotor" id="rotor"></g>
  </svg>
  <button id="spin">转</button>
</div>

<div class="result" id="res"></div>
<button id="again" class="again">不乐意，重抽！</button>

<div class="panel">
  <button class="toggle" id="tg">编辑选项</button>
  <div class="list" id="list"></div>
  <div class="add" id="addBox">
    <input id="inp" placeholder="添加想吃的…" maxlength="8">
    <button id="addBtn">添加</button>
  </div>
</div>
</div><!-- /page-wheel -->

<div class="page" id="page-game">
  <div class="list-wrap">
    <div class="sec-title">积分</div>
    <div class="score">
      <div class="sbox">
        <span class="nm" data-nm="a">包包</span>
        <b id="sa">0</b>
        <div class="sops"><button data-dec="a">−</button><button data-inc="a">＋</button></div>
      </div>
      <div class="vs">VS</div>
      <div class="sbox">
        <span class="nm" data-nm="b">秀秀</span>
        <b id="sb">0</b>
        <div class="sops"><button data-dec="b">−</button><button data-inc="b">＋</button></div>
      </div>
    </div>
    <div class="tools"><button id="scReset">重置比分</button></div>

    <div class="sec-title" style="margin-top:26px">石头剪刀布</div>
    <div class="rps">
      <div class="rps-row" id="rowA">
        <div class="rps-nm"><span data-nm2="a">包包</span> 出拳</div>
        <div class="hands"><button data-h="a" data-v="石">石</button><button data-h="a" data-v="剪">剪</button><button data-h="a" data-v="布">布</button></div>
        <div class="picked">已出拳 ✓</div>
      </div>
      <div class="rps-row" id="rowB">
        <div class="rps-nm"><span data-nm2="b">秀秀</span> 出拳</div>
        <div class="hands"><button data-h="b" data-v="石">石</button><button data-h="b" data-v="剪">剪</button><button data-h="b" data-v="布">布</button></div>
        <div class="picked">已出拳 ✓</div>
      </div>
      <button id="showBtn" class="showbtn">揭晓</button>
      <div class="reveal" id="reveal">
        <div class="hands-show">
          <div><i id="ha">石</i><span data-nm3="a">包包</span></div>
          <div class="mid">—</div>
          <div><i id="hb">布</i><span data-nm3="b">秀秀</span></div>
        </div>
        <div class="verdict" id="verdict">平局</div>
        <div class="rps-f">
          <button id="winAdd">胜者 +1</button>
          <button id="rpsAgain" class="primary">再来一局</button>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="tabs">
  <button data-page="wheel" class="on">转盘</button>
  <button data-page="game">对战</button>
</nav>

<script>
/* 从 2026-08-30 起算，每次打开显示第几天 */
(function(){
  const start=new Date(2026,7,30);           // 月份从 0 开始，7 = 8月
  const now=new Date();
  const d0=new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const d1=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((d1-d0)/86400000)+1; // 8月30日当天算第 1 天
  document.getElementById("sub").textContent=days+" · TAP TO SPIN";
})();

const DEFAULT=["泥靴","Oeat","胡恰","三出山","很久以前","采","木浦"];
let items=JSON.parse(localStorage.getItem("kittyLine2")||"null")||DEFAULT.slice();
const rotor=document.getElementById("rotor");
const CX=200,CY=200,R=136;
let rot=0,spinning=false;
const save=()=>localStorage.setItem("kittyLine2",JSON.stringify(items));
const NS="http://www.w3.org/2000/svg";

function draw(){
  rotor.innerHTML="";
  const n=items.length;if(!n)return;
  const step=2*Math.PI/n;
  const g=document.createElementNS(NS,"g");
  g.setAttribute("fill","none");
  g.setAttribute("stroke","var(--ink)");
  g.setAttribute("stroke-width","2");
  g.setAttribute("stroke-linecap","round");
  const inner=document.createElementNS(NS,"circle");
  inner.setAttribute("cx",CX);inner.setAttribute("cy",CY);inner.setAttribute("r",R);
  inner.setAttribute("stroke-width","3.5");
  g.appendChild(inner);
  for(let i=0;i<n;i++){
    const a=i*step-Math.PI/2;
    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("x1",CX+Math.cos(a)*46);ln.setAttribute("y1",CY+Math.sin(a)*46);
    ln.setAttribute("x2",CX+Math.cos(a)*R);ln.setAttribute("y2",CY+Math.sin(a)*R);
    g.appendChild(ln);
  }
  rotor.appendChild(g);
  for(let i=0;i<n;i++){
    const mid=(i+.5)*step-Math.PI/2;
    const deg=mid*180/Math.PI;
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",CX+Math.cos(mid)*(R-16));
    t.setAttribute("y",CY+Math.sin(mid)*(R-16));
    t.setAttribute("text-anchor","end");
    t.setAttribute("dominant-baseline","middle");
    t.setAttribute("fill","var(--ink2)");
    t.setAttribute("font-size",n>10?15:18);
    t.setAttribute("font-weight","500");
    t.setAttribute("font-family",'-apple-system,PingFang SC,sans-serif');
    t.setAttribute("transform","rotate("+deg+" "+(CX+Math.cos(mid)*(R-16))+" "+(CY+Math.sin(mid)*(R-16))+")");
    t.textContent=items[i];
    rotor.appendChild(t);
  }
}
function render(){
  draw();
  const l=document.getElementById("list");l.innerHTML="";
  items.forEach((t,i)=>{
    const d=document.createElement("div");d.className="chip";
    d.innerHTML='<span></span><button>×</button>';
    d.querySelector("span").textContent=t;
    d.querySelector("button").onclick=()=>{items.splice(i,1);save();render();};
    l.appendChild(d);
  });
}
/* 指针每经过一条分割线抖一下 */
const pin=document.getElementById("pin");
let raf=null,lastSeg=null,tickT=0;
function watchTicks(){
  const n=items.length;if(!n)return;
  const seg=360/n;
  const m=new DOMMatrixReadOnly(getComputedStyle(rotor).transform);
  let a=Math.atan2(m.b,m.a)*180/Math.PI;
  a=((a%360)+360)%360;
  const k=Math.floor(a/seg);
  if(lastSeg!==null&&k!==lastSeg){
    pin.style.transform="rotate(-14deg)";
    clearTimeout(tickT);
    tickT=setTimeout(()=>{pin.style.transform="rotate(0deg)";},70);
    if(navigator.vibrate)navigator.vibrate(6);
  }
  lastSeg=k;
  raf=requestAnimationFrame(watchTicks);
}
/* 结果弹出时爪印爆开 */
const PAW='<svg viewBox="0 0 24 24" fill="C"><ellipse cx="12" cy="15.5" rx="6.4" ry="5.4"/><circle cx="4.6" cy="9" r="2.5"/><circle cx="9.6" cy="5.4" r="2.7"/><circle cx="15.2" cy="5.6" r="2.7"/><circle cx="19.8" cy="9.6" r="2.4"/></svg>';
function burst(host){
  const b=document.createElement("div");b.className="burst";
  for(let i=0;i<8;i++){
    const ang=(-160+i*20-10+Math.random()*20)*Math.PI/180;
    const d=64+Math.random()*46;
    const el=document.createElement("div");
    el.innerHTML=PAW.replace("C",i%2?"var(--red)":"var(--ink)");
    const svg=el.firstChild;
    svg.style.setProperty("--dx",(Math.cos(ang)*d*1.5).toFixed(1)+"px");
    svg.style.setProperty("--dy",(Math.sin(ang)*d).toFixed(1)+"px");
    svg.style.setProperty("--rz",(Math.random()*140-70).toFixed(0)+"deg");
    svg.style.animationDelay=(Math.random()*90).toFixed(0)+"ms";
    b.appendChild(svg);
  }
  host.appendChild(b);
  setTimeout(()=>b.remove(),1100);
}
function go(){
  if(spinning||!items.length)return;
  spinning=true;
  const btn=document.getElementById("spin");btn.disabled=true;
  document.getElementById("again").classList.remove("on");
  document.getElementById("res").innerHTML="";
  const n=items.length,idx=Math.floor(Math.random()*n),seg=360/n;
  rot += 360*5 + (360 - (idx*seg + seg/2));
  rotor.style.transform="rotate("+rot+"deg)";
  lastSeg=null;cancelAnimationFrame(raf);raf=requestAnimationFrame(watchTicks);
  setTimeout(()=>{
    cancelAnimationFrame(raf);raf=null;
    pin.style.transform="rotate(0deg)";
    const res=document.getElementById("res");
    const s=document.createElement("span");s.textContent=items[idx];
    res.appendChild(s);
    burst(res);
    document.getElementById("again").classList.add("on");
    if(navigator.vibrate)navigator.vibrate([28,50,18]);
    spinning=false;btn.disabled=false;
  },4850);
}
document.getElementById("spin").onclick=go;
document.getElementById("again").onclick=go;
document.getElementById("tg").onclick=()=>{
  const l=document.getElementById("list"),on=l.classList.toggle("on");
  document.getElementById("addBox").style.display=on?"flex":"none";
};
document.getElementById("addBtn").onclick=()=>{
  const i=document.getElementById("inp"),v=i.value.trim();
  if(!v||items.length>=14)return;items.push(v);i.value="";save();render();
};
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("addBtn").click();});
render();


/* ========== 积分 & 石头剪刀布 ========== */
const G={
  names:JSON.parse(localStorage.getItem("kw_names")||'null')||{a:"包包",b:"秀秀"},
  score:JSON.parse(localStorage.getItem("kw_score")||'null')||{a:0,b:0}
};
const saveG=()=>{localStorage.setItem("kw_names",JSON.stringify(G.names));
                 localStorage.setItem("kw_score",JSON.stringify(G.score));};
function paintG(){
  document.getElementById("sa").textContent=G.score.a;
  document.getElementById("sb").textContent=G.score.b;
  document.querySelectorAll("[data-nm],[data-nm2],[data-nm3]").forEach(el=>{
    const k=el.dataset.nm||el.dataset.nm2||el.dataset.nm3;
    el.textContent=G.names[k];
  });
}
document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
  G.score[b.dataset.inc]++;saveG();paintG();if(navigator.vibrate)navigator.vibrate(12);});
document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.dec;G.score[k]=Math.max(0,G.score[k]-1);saveG();paintG();});
document.querySelectorAll("[data-nm]").forEach(el=>el.onclick=()=>{
  const v=prompt("改个名字",G.names[el.dataset.nm]);
  if(v&&v.trim()){G.names[el.dataset.nm]=v.trim().slice(0,6);saveG();paintG();}});
document.getElementById("scReset").onclick=()=>{
  if(!confirm("比分清零？"))return;G.score={a:0,b:0};saveG();paintG();};

/* 出拳：选完就隐藏，两边都出了才揭晓 */
const BEAT={"石":"剪","剪":"布","布":"石"};
let pick={a:null,b:null},winner=null;
const rps=document.querySelector(".rps");
document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.h;
  if(pick[k])return;
  pick[k]=b.dataset.v;
  document.getElementById(k==="a"?"rowA":"rowB").classList.add("done");
  if(navigator.vibrate)navigator.vibrate(10);
  if(pick.a&&pick.b)rps.classList.add("ready");
});
document.getElementById("showBtn").onclick=showResult;
function showResult(){
  document.getElementById("ha").textContent=pick.a;
  document.getElementById("hb").textContent=pick.b;
  const v=document.getElementById("verdict");
  if(pick.a===pick.b){winner=null;v.textContent="平局";}
  else if(BEAT[pick.a]===pick.b){winner="a";v.textContent=G.names.a+" 胜";}
  else{winner="b";v.textContent=G.names.b+" 胜";}
  document.getElementById("winAdd").disabled=!winner;
  document.getElementById("winAdd").textContent=winner?G.names[winner]+" +1":"平局不加分";
  rps.classList.add("over");
  if(navigator.vibrate)navigator.vibrate([25,45,25]);
}
document.getElementById("winAdd").onclick=()=>{
  if(!winner)return;
  G.score[winner]++;saveG();paintG();
  document.getElementById("winAdd").disabled=true;
  document.getElementById("winAdd").textContent="已加分 ✓";
};
document.getElementById("rpsAgain").onclick=()=>{
  pick={a:null,b:null};winner=null;
  rps.classList.remove("over");rps.classList.remove("ready");
  document.getElementById("rowA").classList.remove("done");
  document.getElementById("rowB").classList.remove("done");
};
paintG();

document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("page-"+b.dataset.page).classList.add("on");
    window.scrollTo(0,0);
  };
});
renderTopics();
</script>
</body>
</html>
